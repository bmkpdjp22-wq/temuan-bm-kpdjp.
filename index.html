<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Temuan & Berita Acara — KPDJP</title>
  <style>
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --primary: #0b3b60;
      --primary-dark: #072842;
      --accent: #0284c7;
      --text: #0f172a;
      --muted: #64748b;
      --border: #dbe3ec;
      --success-bg: #dcfce7;
      --success-text: #15803d;
      --warn-bg: #fef3c7;
      --warn-text: #b45309;
      --info-bg: #e0f2fe;
      --info-text: #0369a1;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 40px;
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
    }

    .topbar {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 60%, var(--accent) 100%);
      color: #ffffff;
      border-radius: 14px;
      padding: 20px 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .badge-top {
      display: inline-block;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .topbar h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .topbar p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.88);
      margin-top: 3px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 8px 13px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s ease;
    }

    .btn-glass {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-glass:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    .sheet-switcher {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .two-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-sheet {
      background: #e2e8f0;
      color: var(--text);
      padding: 9px 15px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
    }
