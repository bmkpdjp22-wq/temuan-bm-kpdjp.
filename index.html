<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Temuan & Berita Acara — KPDJP</title>
  <style>
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --primary: #0b3b60;
      --primary-dark: #072842;
      --accent: #0284c7;
      --text: #0f172a;
      --muted: #64748b;
      --border: #dbe3ec;
      --success-bg: #dcfce7;
      --success-text: #15803d;
      --warn-bg: #fef3c7;
      --warn-text: #b45309;
      --info-bg: #e0f2fe;
      --info-text: #0369a1;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 16px 24px;
    }

    .app {
      max-width: 1320px;
      margin: 0 auto;
    }

    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg);
      padding-top: 12px;
      padding-bottom: 8px;
    }

    .topbar {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 60%, var(--accent) 100%);
      color: #ffffff;
      border-radius: 14px;
      padding: 14px 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .badge-top {
      display: inline-block;
      width: fit-content;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .topbar h1 {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .topbar-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 7px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s ease;
    }

    .btn-white {
      background: #ffffff;
      color: var(--primary-dark);
    }

    .btn-white:hover {
      background: #f1f5f9;
    }

    .btn-glass {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-glass:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    .control-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .four-buttons-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .sheet-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn-sheet {
      background: #e2e8f0;
      color: var(--text);
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
    }

    .btn-sheet.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(11, 59, 96, 0.22);
    }

    .pill {
      background: rgba(15, 23, 42, 0.12);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
    }

    .btn-sheet.active .pill {
      background: rgba(255, 255, 255, 0.24);
      color: #ffffff;
    }

    .divider-v {
      width: 1px;
      height: 22px;
      background: var(--border);
    }

    .status-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .btn-status-filter {
      background: var(--surface-alt);
      border: 1px dashed #94a3b8;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }

    .btn-status-filter .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    .btn-filter-selesai .dot { background: #16a34a; }
    .btn-filter-tunda .dot { background: #d97706; }

    .btn-filter-selesai:hover,
    .btn-filter-selesai.active-filter {
      border-style: solid;
      border-color: #16a34a;
      background: var(--success-bg);
      color: var(--success-text);
    }

    .btn-filter-tunda:hover,
    .btn-filter-tunda.active-filter {
      border-style: solid;
      border-color: #d97706;
      background: var(--warn-bg);
      color: var(--warn-text);
    }

    .filter-count {
      background: rgba(15, 23, 42, 0.08);
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10.5px;
    }

    .active-filter .filter-count {
      background: rgba(255, 255, 255, 0.78);
    }

    .btn-reset-filter {
      background: var(--info-bg);
      color: var(--info-text);
      border: 1px solid #bae6fd;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    select, input[type="text"], input[type="date"], textarea {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12.5px;
      background: #ffffff;
      color: var(--text);
      width: 100%;
    }

    .filter-group select, .filter-group input[type="text"] {
      width: auto;
    }

    .data-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .data-card-head {
      padding: 11px 18px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .data-card-head h2 {
      font-size: 14px;
      color: var(--primary-dark);
    }

    .table-wrap {
      width: 100%;
      max-height: calc(100vh - 210px);
      min-height: 360px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #f1f5f9;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      padding: 10px 13px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 10px 13px;
      border-bottom: 1px solid #edf2f7;
      vertical-align: top;
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-ok { background: var(--success-bg); color: var(--success-text); }
    .badge-wait { background: var(--warn-bg); color: var(--warn-text); }

    .empty {
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
    }

    .data-card-foot {
      padding: 10px 18px;
      background: var(--surface-alt);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      border-radius: 14px;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25);
      border: 1px solid var(--border);
    }

    .modal-head {
      padding: 14px 20px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-head h3 {
      font-size: 15px;
      color: var(--primary-dark);
    }

    .modal-body {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .field label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .star-red {
      color: #dc2626;
      font-weight: 700;
      margin-left: 2px;
    }

    .modal-foot {
      padding: 12px 20px;
      background: var(--surface-alt);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-cancel {
      background: #e2e8f0;
      color: var(--text);
    }

    .form-msg {
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.45;
    }

    .form-msg.err { display: block; background: #fee2e2; color: #b91c1c; }
    .form-msg.ok { display: block; background: var(--success-bg); color: var(--success-text); }

    @media (max-width: 768px) {
      .divider-v { display: none; }
      .table-wrap { max-height: 65vh; }
    }
  </style>
</head>

  <script>
    const SHEET_ID = "1kW3IsDOgG7uhh02mJc3DYz_d8bjDt_-nKQxvbB5A8EE";
    const GID_TEMUAN = "0";
    const GID_BA = "1339186549";
    const JSON_PATH = "./data/data_temuan_ba.json";
    const CACHE_KEY = "kpdjp_monitoring_cache_v16";

    const GS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxML3ontN7yvh3euJBbczVxXPufp35FnXMTlFSAG1_cb-6fpo8gZMV-KdNm7Ev5ypCtlg/exec";

    const appData = {
      sheet: "TEMUAN",
      statusFilter: "ALL",
      temuan: [],
      beritaAcara: [],
      source: "-",
      updated: "-",
      error: "",
      loadingMsg: "Memuat data..."
    };

    function fetchWithTimeout(url, options = {}, timeoutMs = 2500) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      return fetch(url, { ...options, signal: controller.signal })
        .finally(() => clearTimeout(timer));
    }

    function saveCache() {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          temuan: appData.temuan,
          beritaAcara: appData.beritaAcara,
          source: appData.source,
          updated: appData.updated
        }));
      } catch (_) {}
    }

    function loadCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return false;
        const c = JSON.parse(raw);
        if (!Array.isArray(c.temuan) || !Array.isArray(c.beritaAcara)) return false;
        if (c.temuan.length === 0 && c.beritaAcara.length === 0) return false;
        appData.temuan = c.temuan.map(normalizeTemuanItem);
        appData.beritaAcara = c.beritaAcara.map(normalizeBaItem);
        appData.source = (c.source || "Cache") + " (instan)";
        appData.updated = c.updated || "-";
        appData.error = "";
        return true;
      } catch (_) {
        return false;
      }
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (ch === '"' && inQuotes && next === '"') {
          cell += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = !inQuotes;
        } else if (ch === "," && !inQuotes) {
          row.push(cell.trim());
          cell = "";
        } else if ((ch === "\n" || ch === "\r") && !inQuotes) {
          if (ch === "\r" && next === "\n") i++;
          row.push(cell.trim());
          if (row.some(v => v !== "")) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += ch;
        }
      }
      if (cell.length > 0 || row.length > 0) {
        row.push(cell.trim());
        if (row.some(v => v !== "")) rows.push(row);
      }
      return rows;
    }

    function toObjects(rows, marker) {
      let headerIdx = 0;
      for (let i = 0; i < Math.min(rows.length, 8); i++) {
        if (rows[i].join("|").toUpperCase().includes(marker)) {
          headerIdx = i;
          break;
        }
      }
      const headers = rows[headerIdx] || [];
      const list = [];
      for (let r = headerIdx + 1; r < rows.length; r++) {
        const obj = {};
        let hasVal = false;
        headers.forEach((h, idx) => {
          if (!h) return;
          const v = (rows[r][idx] || "").trim();
          if (v !== "") hasVal = true;
          obj[h.trim().toUpperCase()] = v;
        });
        if (hasVal) list.push(obj);
      }
      return list;
    }

    function pick(obj, keys) {
      for (const k of keys) {
        if (obj[k] !== undefined && obj[k] !== "") return obj[k];
      }
      return "";
    }

    function normalizeTemuanItem(r, i) {
      return {
        no: r.no ?? pick(r, ["NO"]) ?? String(i + 1),
        no_ba: r.no_ba ?? pick(r, ["NO BA (JIKA ADA)", "NO BA", "NO_BA"]),
        divisi: r.divisi ?? pick(r, ["DIVISI"]),
        uraian_temuan: r.uraian_temuan ?? pick(r, ["URAIAN TEMUAN"]),
        lokasi: r.lokasi ?? pick(r, ["LOKASI/LANTAI (DETAIL)", "LOKASI/LANTAI", "LOKASI"]),
        gedung: r.gedung ?? pick(r, ["GEDUNG"]),
        tanggal_temuan: r.tanggal_temuan ?? pick(r, ["TANGGAL TEMUAN"]),
        jenis_temuan: r.jenis_temuan ?? pick(r, ["TEMUAN (PREVENTIVE/BA)", "TEMUAN (PREVENTIVE/BA"]),
        tindak_lanjut: r.tindak_lanjut ?? pick(r, ["TINDAK LANJUT"]),
        tanggal_perbaikan: r.tanggal_perbaikan ?? pick(r, ["TANGGAL PERBAIKAN"]),
        status: r.status ?? pick(r, ["STATUS (TUNDA/SELESAI)", "STATUS"]),
        keterangan: r.keterangan ?? pick(r, ["KETERANGAN"])
      };
    }

    function normalizeBaItem(r) {
      return {
        no_berita_acara: r.no_berita_acara ?? pick(r, ["NO BERITA ACARA", "NO BA"]),
        pelapor: r.pelapor ?? pick(r, ["PELAPOR"]),
        divisi: r.divisi ?? pick(r, ["DIVISI"]),
        uraian: r.uraian ?? pick(r, ["URAIAN"]),
        tanggal: r.tanggal ?? pick(r, ["TANGGAL", "TANGGAL TEMUAN"]),
        lokasi_lantai: r.lokasi_lantai ?? pick(r, ["LOKASI/LANTAI (DETAIL)", "LOKASI/LANTAI", "LOKASI LANTAI"]),
        gedung: r.gedung ?? pick(r, ["GEDUNG"]),
        status: r.status ?? pick(r, ["STATUS"]),
        tindak_lanjut: r.tindak_lanjut ?? pick(r, ["TINDAK LANJUT"]),
        tanggal_perbaikan: r.tanggal_perbaikan ?? pick(r, ["TANGGAL PERBAIKAN"]),
        keterangan: r.keterangan ?? pick(r, ["KETERANGAN"])
      };
    }

    async function loadFromGitHub(bust) {
      const url = bust ? `${JSON_PATH}?t=${Date.now()}` : JSON_PATH;
      const res = await fetchWithTimeout(url, bust ? { cache: "no-store" } : {}, 2000);
      if (!res.ok) throw new Error("JSON belum tersedia");
      const json = await res.json();
      appData.temuan = Array.isArray(json.temuan) ? json.temuan.map(normalizeTemuanItem) : [];
      appData.beritaAcara = Array.isArray(json.berita_acara) ? json.berita_acara.map(normalizeBaItem) : [];
      appData.updated = json.updated_at_wib || json.updated_at || "-";
      appData.source = "Vercel / GitHub JSON";
      appData.error = "";
      saveCache();
    }

    async function loadFromSheets() {
      const bust = `_=${Date.now()}`;
      const u1 = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_TEMUAN}&${bust}`;
      const u2 = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_BA}&${bust}`;
      const [r1, r2] = await Promise.all([
        fetchWithTimeout(u1, { mode: "cors" }, 2500),
        fetchWithTimeout(u2, { mode: "cors" }, 2500)
      ]);
      if (!r1.ok || !r2.ok) throw new Error("Gagal ambil CSV Google Sheets");

      const [csv1, csv2] = await Promise.all([r1.text(), r2.text()]);
      const rawT = toObjects(parseCSV(csv1), "URAIAN TEMUAN");
      const rawB = toObjects(parseCSV(csv2), "NO BERITA ACARA");

      appData.temuan = rawT.map(normalizeTemuanItem);
      appData.beritaAcara = rawB.map(normalizeBaItem);
      appData.updated = new Date().toLocaleString("id-ID");
      appData.source = "Google Sheets CSV";
      appData.error = "";
      saveCache();
    }

    async function loadData(bust = false) {
      const hasCached = loadCache();
      if (hasCached) {
        refreshSummary();
        renderTable();
      } else {
        appData.loadingMsg = "Mengambil data dari GitHub JSON...";
        renderTable();
      }

      appData.error = "";
      try {
        await loadFromGitHub(bust);
      } catch (_) {
        if (!hasCached) {
          appData.loadingMsg = "JSON belum ada, mencoba Google Sheets...";
          renderTable();
        }
        try {
          await loadFromSheets();
        } catch (_) {
          if (!hasCached) {
            appData.source = "Belum terhubung";
            appData.error = "File <strong>./data/data_temuan_ba.json</strong> belum ditemukan di repo GitHub dan akses CSV Google Sheets tidak merespons.";
          }
        }
      }

      refreshSummary();
      renderTable();
    }

    function openInputModal() {
      const msg = document.getElementById("formMsg");
      msg.className = "form-msg";
      msg.textContent = "";
      document.getElementById("inputType").value = appData.sheet === "BA" ? "BA" : "TEMUAN";
      toggleFormFields();
      updateNoBaRequirement();
      document.getElementById("inputModal").classList.add("open");
    }

    function closeInputModal() {
      document.getElementById("inputModal").classList.remove("open");
    }

    function toggleFormFields() {
      const isBa = document.getElementById("inputType").value === "BA";
      document.getElementById("fieldsTemuan").style.display = isBa ? "none" : "block";
      document.getElementById("fieldsBa").style.display = isBa ? "block" : "none";
      updateNoBaRequirement();
    }

    function updateNoBaRequirement() {
      const sheetTujuan = document.getElementById("inputType").value;
      const jenisTemuan = document.getElementById("t_jenis").value;
      const mustHaveBa = sheetTujuan === "BA" || jenisTemuan === "Berita Acara";
      document.getElementById("t_no_ba_req").style.display = mustHaveBa ? "inline" : "none";
    }

    function showFormError(text, focusEl = null) {
      const msg = document.getElementById("formMsg");
      msg.className = "form-msg err";
      msg.textContent = text;
      if (focusEl) focusEl.focus();
    }

    async function submitFormData(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmitForm");
      const msg = document.getElementById("formMsg");
      msg.className = "form-msg";
      msg.textContent = "";

      const type = document.getElementById("inputType").value;
      if (!type) {
        return showFormError("Lengkapi kolom bertanda * merah.", document.getElementById("inputType"));
      }

      let payloadData = {};

      if (type === "TEMUAN") {
        const jenisTemuan = document.getElementById("t_jenis").value;
        const noBa = document.getElementById("t_no_ba").value.trim();
        const divisi = document.getElementById("t_divisi").value;
        const gedung = document.getElementById("t_gedung").value;
        const lokasi = document.getElementById("t_lokasi").value.trim();
        const tglTemuan = document.getElementById("t_tgl_temuan").value;
        const status = document.getElementById("t_status").value;
        const tglPerbaikan = document.getElementById("t_tgl_perbaikan").value;
        const uraian = document.getElementById("t_uraian").value.trim();
        const tindakLanjut = document.getElementById("t_tindak").value.trim();
        const keterangan = document.getElementById("t_ket").value.trim();

        if (jenisTemuan === "Berita Acara" && !noBa) {
          return showFormError("Lengkapi kolom bertanda * merah.", document.getElementById("t_no_ba"));
        }
        if (!divisi) {
          return showFormError("Lengkapi kolom bertanda * merah.", document.getElementById("t_divisi"));
        }
        if (!lokasi) {
          return showFormError("Lengkapi kolom bertanda * merah.", document.getElementById("t_lokasi"));
        }
        if (!tglTemuan) {
          return showFormError("Lengkapi kolom bertanda * merah.", document.getElementById("t_tgl_temuan"));
        }
        if (!status) {
          return showFormError("Lengkapi kolom bertanda * merah.", document.getElementById("t_status"));
        }
        if (!tindakLanjut) {
          return showFormError("Lengkapi kolom bertanda * merah.", document.getElementById("t_tindak"));
        }

        payloadData = {
          no: String(appData.temuan.length + 1),
          no_ba: noBa,
          divisi,
          uraian_temuan: uraian,
          lokasi,
          gedung,
          tanggal_temuan: tglTemuan,
          jenis_temuan: jenisTemuan,
          tindak_lanjut: tindakLanjut,
          tanggal_perbaikan: tglPerbaikan,
          status,
          keterangan
        };
      } else {
        const noBa = document.getElementById("b_no").value.trim();
        const pelapor = document.getElementById("b_pelapor").value.trim();
        const divisi = document.getElementById("b_divisi").value;
        const tanggal = document.getElementById("b_tanggal").value;
        const lokasiLantai = document.getElementById("b_lokasi").value.trim();
        const gedung = document.getElementById("b_gedung").value;
        const status = document.getElementById("b_status").value;
        const tglPerbaikan = document.getElementById("b_tgl_perbaikan").value;
        const uraian = document.getElementById("b_uraian").value.trim();
        const tindakLanjut = document.getElementById("b_tindak").value.trim();
        const keterangan = document.getElementById("b_ket").value.trim();

        if (!noBa) {
          return showFormError("Lengkapi kolom bertanda * merah.", document.getElementById("b_no"));
        }
        if (!divisi) {
          return showFormError("Lengkapi kolom bertanda * merah.", document.getElementById("b_divisi"));
        }
        if (!tanggal) {
          return showFormError("Lengkapi kolom bertanda * merah.", document.getElementById("b_tanggal"));
        }
        if (!lokasiLantai) {
          return showFormError("Lengkapi kolom bertanda * merah.", document.getElementById("b_lokasi"));
        }
        if (!status) {
          return showFormError("Lengkapi kolom bertanda * merah.", document.getElementById("b_status"));
        }
        if (!tindakLanjut) {
          return showFormError("Lengkapi kolom bertanda * merah.", document.getElementById("b_tindak"));
        }

        payloadData = {
          no_berita_acara: noBa,
          pelapor,
          divisi,
          uraian,
          tanggal,
          lokasi_lantai: lokasiLantai,
          gedung,
          status,
          tindak_lanjut: tindakLanjut,
          tanggal_perbaikan: tglPerbaikan,
          keterangan
        };
      }

      btn.disabled = true;
      btn.textContent = "Menyimpan...";

      try {
        const saveUrl = `${GS_WEB_APP_URL}?action=save&payload=${encodeURIComponent(JSON.stringify({ type, data: payloadData }))}`;
        await fetch(saveUrl, { method: "GET", mode: "no-cors" });

        if (type === "TEMUAN") {
          appData.temuan.push(normalizeTemuanItem(payloadData, appData.temuan.length));
          selectSheet("TEMUAN");
        } else {
          appData.beritaAcara.push(normalizeBaItem(payloadData));
          selectSheet("BA");
        }

        appData.updated = new Date().toLocaleString("id-ID");
        appData.source = "Google Sheets (tersimpan)";
        saveCache();
        refreshSummary();
        renderTable();

        msg.className = "form-msg ok";
        msg.textContent = "Data berhasil disimpan ke Google Sheets!";
        document.getElementById("dataForm").reset();
        setTimeout(() => closeInputModal(), 700);
      } catch (err) {
        showFormError(err.message || String(err));
      } finally {
        btn.disabled = false;
        btn.textContent = "Simpan ke Google Sheets";
      }
    }

    function refreshSummary() {
      const tTotal = appData.temuan.length;
      const tSelesai = appData.temuan.filter(x => String(x.status || "").toUpperCase().includes("SELESAI")).length;
      const tTunda = Math.max(0, tTotal - tSelesai);
      const bTotal = appData.beritaAcara.length;

      document.getElementById("count-temuan").textContent = tTotal;
      document.getElementById("count-ba").textContent = bTotal;

      document.getElementById("pill-selesai").textContent = tSelesai;
      document.getElementById("pill-tunda").textContent = tTunda;

      document.getElementById("sourceLabel").textContent = "Sumber: " + appData.source;
      document.getElementById("updateLabel").textContent = "Update: " + appData.updated;
      updateFilterButtonsUI();
    }

    function updateFilterButtonsUI() {
      const btnSelesai = document.getElementById("btn-filter-selesai");
      const btnTunda = document.getElementById("btn-filter-tunda");
      const btnReset = document.getElementById("btn-reset-filter");
      const ctx = document.getElementById("activeContextInfo");

      btnSelesai.classList.remove("active-filter");
      btnTunda.classList.remove("active-filter");

      const isActive = appData.sheet === "TEMUAN" && appData.statusFilter !== "ALL";
      btnReset.style.display = isActive ? "inline-flex" : "none";

      if (appData.sheet === "TEMUAN") {
        if (appData.statusFilter === "SELESAI") {
          btnSelesai.classList.add("active-filter");
          ctx.textContent = "Menampilkan: Sheet TEMUAN • Filter Status: SELESAI";
        } else if (appData.statusFilter === "TUNDA") {
          btnTunda.classList.add("active-filter");
          ctx.textContent = "Menampilkan: Sheet TEMUAN • Filter Status: TUNDA";
        } else {
          ctx.textContent = "Menampilkan: Sheet TEMUAN (Semua Status)";
        }
      } else {
        ctx.textContent = "Menampilkan: Sheet BERITA ACARA";
      }
    }

    function setStatusFilter(status) {
      if (status === "ALL") {
        appData.statusFilter = "ALL";
      } else if (appData.sheet === "TEMUAN" && appData.statusFilter === status) {
        appData.statusFilter = "ALL";
      } else {
        appData.statusFilter = status;
      }

      if (appData.sheet !== "TEMUAN") {
        appData.sheet = "TEMUAN";
        document.getElementById("btn-sheet-temuan").classList.add("active");
        document.getElementById("btn-sheet-ba").classList.remove("active");
      }

      updateFilterButtonsUI();
      renderTable();
    }

    function selectSheet(sheetName) {
      appData.sheet = sheetName;
      document.getElementById("btn-sheet-temuan").classList.toggle("active", sheetName === "TEMUAN");
      document.getElementById("btn-sheet-ba").classList.toggle("active", sheetName === "BA");
      updateFilterButtonsUI();
      renderTable();
    }

    function badge(val) {
      const s = String(val || "").trim();
      if (!s || s === "-") return `<span class="badge badge-wait">${s || "BELUM DIISI"}</span>`;
      if (s.toUpperCase().includes("SELESAI")) return `<span class="badge badge-ok">${s}</span>`;
      return `<span class="badge badge-wait">${s}</span>`;
    }

    function normalizeGedungKey(val) {
      return String(val || "")
        .toUpperCase()
        .replace(/Í/g, "I")
        .replace(/^GEDUNG\s+/, "")
        .trim();
    }

    function passFilter(item, isTemuan = false) {
      if (isTemuan && appData.statusFilter !== "ALL") {
        const isSelesai = String(item.status || "").toUpperCase().includes("SELESAI");
        if (appData.statusFilter === "SELESAI" && !isSelesai) return false;
        if (appData.statusFilter === "TUNDA" && isSelesai) return false;
      }

      const gedung = normalizeGedungKey(document.getElementById("gedungFilter").value);
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      if (gedung && !normalizeGedungKey(item.gedung).includes(gedung)) return false;
      if (q && !JSON.stringify(item).toLowerCase().includes(q)) return false;
      return true;
    }

    function renderTable() {
      const area = document.getElementById("tableArea");
      const heading = document.getElementById("sheetHeading");
      const rowInfo = document.getElementById("rowInfo");

      if (appData.sheet === "TEMUAN") {
        const labelFilter = appData.statusFilter === "ALL" ? "" : ` • Filter: ${appData.statusFilter}`;
        heading.textContent = `Sheet: TEMUAN${labelFilter}`;
        const rows = appData.temuan.filter(item => passFilter(item, true));
        rowInfo.textContent = `${rows.length} baris`;

        if (!rows.length) {
          const msg = appData.error || (appData.temuan.length === 0 ? appData.loadingMsg : "Belum ada data pada sheet TEMUAN untuk filter ini.");
          area.innerHTML = `<div class="empty">${msg}</div>`;
          return;
        }

        area.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>No BA</th>
                <th>Divisi</th>
                <th>Uraian Temuan</th>
                <th>Lokasi/lantai (detail)</th>
                <th>Gedung</th>
                <th>Tgl Temuan</th>
                <th>Temuan (Preventive/BA)</th>
                <th>Tindak Lanjut</th>
                <th>Tgl Perbaikan</th>
                <th>Status</th>
                <th>Keterangan</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td>${r.no || "-"}</td>
                  <td><strong>${r.no_ba || "-"}</strong></td>
                  <td><strong>${r.divisi || "-"}</strong></td>
                  <td>${r.uraian_temuan || "-"}</td>
                  <td>${r.lokasi || "-"}</td>
                  <td>${r.gedung || "-"}</td>
                  <td>${r.tanggal_temuan || "-"}</td>
                  <td>${r.jenis_temuan || "-"}</td>
                  <td>${r.tindak_lanjut || "-"}</td>
                  <td>${r.tanggal_perbaikan || "-"}</td>
                  <td>${badge(r.status)}</td>
                  <td>${r.keterangan || "-"}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      } else {
        heading.textContent = "Sheet: BERITA ACARA";
        const rows = appData.beritaAcara.filter(item => passFilter(item, false));
        rowInfo.textContent = `${rows.length} baris`;

        if (!rows.length) {
          const msg = appData.error || (appData.beritaAcara.length === 0 ? appData.loadingMsg : "Belum ada data pada sheet BERITA ACARA.");
          area.innerHTML = `<div class="empty">${msg}</div>`;
          return;
        }

        area.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>No Berita Acara</th>
                <th>Pelapor</th>
                <th>Divisi</th>
                <th>Uraian</th>
                <th>Tanggal</th>
                <th>Lokasi/Lantai</th>
                <th>Gedung</th>
                <th>Status</th>
                <th>Keterangan</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td><strong>${r.no_berita_acara || "-"}</strong></td>
                  <td>${r.pelapor || "-"}</td>
                  <td>${r.divisi || "-"}</td>
                  <td>${r.uraian || "-"}</td>
                  <td>${r.tanggal || "-"}</td>
                  <td>${r.lokasi_lantai || "-"}</td>
                  <td>${r.gedung || "-"}</td>
                  <td>${badge(r.status)}</td>
                  <td>${r.keterangan || "-"}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }
    }

    loadData(false);
  </script>
</body>
</html>
