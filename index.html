<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Temuan & Berita Acara — KPDJP</title>
  <style>
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --primary: #0b3b60;
      --primary-dark: #072842;
      --accent: #0284c7;
      --text: #0f172a;
      --muted: #64748b;
      --border: #dbe3ec;
      --success-bg: #dcfce7;
      --success-text: #15803d;
      --warn-bg: #fef3c7;
      --warn-text: #b45309;
      --danger-bg: #fee2e2;
      --danger-text: #b91c1c;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #e2e8f0 0%, var(--bg) 220px);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
    }

    .topbar {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 60%, var(--accent) 100%);
      color: #fff;
      border-radius: 16px;
      padding: 24px 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .topbar-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
    }

    .topbar h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .topbar p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 4px;
    }

    .topbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button, .file-label {
      border: none;
      border-radius: 10px;
      padding: 10px 15px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-light {
      background: #ffffff;
      color: var(--primary-dark);
    }

    .btn-light:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.28);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary-dark);
      margin-top: 6px;
    }

    .stat-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .sheet-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--surface-alt);
      padding: 5px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .sheet-tab {
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      padding: 9px 16px;
    }

    .sheet-tab.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(11, 59, 96, 0.25);
    }

    .count-pill {
      background: rgba(15, 23, 42, 0.1);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .sheet-tab.active .count-pill {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    select, input[type="text"] {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }

    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-header-bar {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--surface-alt);
    }

    .table-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      background: #f1f5f9;
      color: var(--primary-dark);
      font-weight: 700;
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid #eef2f6;
      vertical-align: top;
      line-height: 1.45;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-selesai {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .badge-tunda {
      background: var(--warn-bg);
      color: var(--warn-text);
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state strong {
      display: block;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .notice-error {
      margin-top: 10px;
      display: inline-block;
      background: var(--danger-bg);
      color: var(--danger-text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }

    .statusbar {
      padding: 12px 20px;
      background: var(--surface-alt);
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 18px;
      }
      .topbar h1 {
        font-size: 18px;
      }
    }
  </style>
</head>

        <h1>Monitoring Temuan & Berita Acara</h1>

        </label>
        <button class="btn-light" onclick="exportJson()">↓ Unduh JSON</button>
      </div>
    </header>
